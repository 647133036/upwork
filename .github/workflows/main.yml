            echo 'IgogICAgICAgIGlmICJqdXN0IGEgbW9tZW50IiBpbiB0Lmxvd2VyKCk6CiAgICAgICAgICAgIHJl' >> pw.b64
            echo 'dHVybiBUcnVlCiAgICAgICAgaCA9IHBnLmNvbnRlbnQoKVs6MTUwMF0KICAgICAgICByZXR1cm4g' >> pw.b64
            echo 'Ym9vbChyZS5zZWFyY2gociJjZi18Y2hhbGxlbmdlfGp1c3QgYSBtb21lbnR8dHVybnN0aWxlfGNh' >> pw.b64
            echo 'cHRjaGEiLCBoLCByZS5JKSkKICAgIGV4Y2VwdCBFeGNlcHRpb246CiAgICAgICAgcmV0dXJuIEZh' >> pw.b64
            echo 'bHNlCgpkZWYgZHVtcChwZywgbGFiZWwpOgogICAgdHJ5OgogICAgICAgIGggPSBwZy5jb250ZW50' >> pw.b64
