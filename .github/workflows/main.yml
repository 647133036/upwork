            echo 'Y3JpcHQoIk9iamVjdC5kZWZpbmVQcm9wZXJ0eShuYXZpZ2F0b3IsJ3dlYmRyaXZlcicse2dldDoo' >> pw.b64
            echo 'KT0+dW5kZWZpbmVkfSkiKQogICAgcGFnZSA9IGN0eC5uZXdfcGFnZSgpCiAgICBwYWdlLmdvdG8o' >> pw.b64
            echo 'VkFSSUFOVCwgdGltZW91dD05MDAwMCwgd2FpdF91bnRpbD0iZG9tY29udGVudGxvYWRlZCIpCgog' >> pw.b64
            echo 'ICAgZm91bmQgPSBOb25lCiAgICBkZWFkbGluZSA9IHRpbWUudGltZSgpICsgMTIwCiAgICB3aGls' >> pw.b64
            echo 'ZSB0aW1lLnRpbWUoKSA8IGRlYWRsaW5lOgogICAgICAgIGZvciBzZWwgaW4gU0VMRUNUT1JTOgog' >> pw.b64
            echo 'ICAgICAgICAgICB0cnk6CiAgICAgICAgICAgICAgICBsb2MgPSBwYWdlLmxvY2F0b3Ioc2VsKQog' >> pw.b64
