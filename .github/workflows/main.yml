            ./pw-venv/bin/python -c "import base64; open('pw_fetch.py','wb').write(base64.b64decode(open('pw.b64').read()))"
            ./pw-venv/bin/python pw_fetch.py
            RC=$?
            kill $XVFB_PID 2>/dev/null || true
            [ $RC -eq 0 ] || exit $RC
          fi

          echo "== final check =="
          file "$FILE" ; ls -la "$FILE" ; sha256sum "$FILE"
          file "$FILE" | grep -qiE 'zip|android|archive' || { echo "FATAL: XAPK not obtained"; exit 1; }

      - name: Fetch desktop installer 5.8.0.46 (non-fatal)
        run: |
          set -uo pipefail
          URL="https://upwork-usw2-desktopapp.upwork.com/binaries/v5_8_0_46_d1c5f9d56c7f41ff/UpworkSetup64.exe"
          FILE="Upwork-5.8.0.46-win64.exe"
          code=$(curl -sL -A "Mozilla/5.0" "$URL" -o "$FILE" -w "%{http_code}")
          echo "http=$code"
          if [ "$code" = "200" ] && file "$FILE" | grep -qE 'PE32|executable'; then
            ls -la "$FILE"; sha256sum "$FILE"
          else
            echo "WARN: desktop installer download failed (non-fatal, skipping)"
            rm -f "$FILE"
          fi

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FILES=$(ls upwork-2.16.0-arm64-v8a.xapk Upwork-5.8.0.46-win64.exe 2>/dev/null || true)
          echo "uploading: $FILES"
          [ -n "$FILES" ] || { echo "nothing to upload"; exit 1; }
          gh release delete v1 --yes 2>/dev/null || true
          gh release create v1 $FILES \
             --title "Upwork 2.16.0 XAPK + desktop 5.8.0.46 (official)" \
             --repo "${{ github.repository }}"
          gh release view v1 --repo "${{ github.repository }}"

