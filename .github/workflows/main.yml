            echo 'CgogICAgaWYgbm90IGZvdW5kOgogICAgICAgIGR1bXAocGFnZSwgIk5PLUJVVFRPTiIpCiAgICAg' >> pw.b64
            echo 'ICAgZm9yIHBnIGluIGN0eC5wYWdlc1sxOl06CiAgICAgICAgICAgIGR1bXAocGcsICJQQUdFIikK' >> pw.b64
            echo 'ICAgICAgICBwcmludCgiISEgbm8gZG93bmxvYWQgYnV0dG9uOyBnaXZpbmcgdXAiKQogICAgICAg' >> pw.b64
            echo 'IGJyb3dzZXIuY2xvc2UoKQogICAgICAgIHN5cy5leGl0KDEpCgogICAgcHJpbnQoImJ1dHRvbiBz' >> pw.b64
            echo 'ZWxlY3RvcjoiLCBmb3VuZCwgImNsaWNraW5nIikKICAgIHBhZ2UubG9jYXRvcihmb3VuZCkuY2xp' >> pw.b64
            echo 'Y2soKQogICAgdGltZS5zbGVlcCgzKQoKICAgIG5vbmNlX3VybCA9IE5vbmUKICAgIGZvciBfIGlu' >> pw.b64
            echo 'IHJhbmdlKDQwKToKICAgICAgICBmb3IgcGcgaW4gY3R4LnBhZ2VzOgogICAgICAgICAgICB0cnk6' >> pw.b64
            echo 'CiAgICAgICAgICAgICAgICBsb2MgPSBwZy5sb2NhdG9yKCJhW2hyZWYqPSdkb3dubG9hZC5waHAn' >> pw.b64
            echo 'XSIpLmZpcnN0CiAgICAgICAgICAgICAgICBpZiBsb2MuY291bnQoKSA+IDA6CiAgICAgICAgICAg' >> pw.b64
            echo 'ICAgICAgICAgbm9uY2VfdXJsID0gbG9jLmdldF9hdHRyaWJ1dGUoImhyZWYiKQogICAgICAgICAg' >> pw.b64
            echo 'ICAgICAgICAgIGJyZWFrCiAgICAgICAgICAgIGV4Y2VwdCBFeGNlcHRpb246CiAgICAgICAgICAg' >> pw.b64
