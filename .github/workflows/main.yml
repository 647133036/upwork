            echo 'ZSgpOgogICAgICAgICAgICAgICAgICAgIGZvdW5kID0gc2VsCiAgICAgICAgICAgICAgICAgICAg' >> pw.b64
            echo 'YnJlYWsKICAgICAgICAgICAgZXhjZXB0IEV4Y2VwdGlvbjoKICAgICAgICAgICAgICAgIHBhc3MK' >> pw.b64
