            echo 'LWFuZHJvaWQtYXBrLWRvd25sb2FkLyIKRklMRSA9ICJ1cHdvcmstMi4xNi4wLWFybTY0LXY4YS54' >> pw.b64
            echo 'YXBrIgpTRUxFQ1RPUlMgPSBbImEuZG93bmxvYWRCdXR0b24iLCAiYS5idG4tYmxvY2siLCAiYS5i' >> pw.b64
