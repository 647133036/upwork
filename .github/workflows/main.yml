            echo 'bWUuc2xlZXAoMTgpCiAgICAgICAgdHJ5OgogICAgICAgICAgICBwYWdlLnJlbG9hZCh0aW1lb3V0' >> pw.b64
            echo 'PTMwMDAwLCB3YWl0X3VudGlsPSJkb21jb250ZW50bG9hZGVkIikKICAgICAgICBleGNlcHQgRXhj' >> pw.b64
            echo 'ZXB0aW9uOgogICAgICAgICAgICBwYXNzCiAgICBpZiBpc19jZihwYWdlKToKICAgICAgICBkdW1w' >> pw.b64
            echo 'KHBhZ2UsICJTVElMTC1DRiIpCiAgICAgICAgcHJpbnQoIiEhIENGIGNoYWxsZW5nZSBub3QgY2xl' >> pw.b64
            echo 'YXJlZCIpCgogICAgZm91bmQgPSBOb25lCiAgICBkZWFkbGluZSA9IHRpbWUudGltZSgpICsgMTIw' >> pw.b64
