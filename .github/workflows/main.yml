            RC=$?
            kill $XVFB_PID 2>/dev/null || true
            [ $RC -eq 0 ] || exit $RC
          fi

          echo "== final check =="
          if [ -f upwork-official.apk ]; then
            echo "android package: upwork-official.apk"
            file upwork-official.apk; ls -la upwork-official.apk; sha256sum upwork-official.apk
          fi
          if [ -f "$ANDROID_OUT" ]; then
            echo "android package: $ANDROID_OUT"
            file "$ANDROID_OUT"; ls -la "$ANDROID_OUT"; sha256sum "$ANDROID_OUT"
          fi
          if [ ! -f upwork-official.apk ] && [ ! -f "$ANDROID_OUT" ]; then
            echo "FATAL: no android package obtained"; exit 1
          fi

      - name: Fetch desktop installer 5.8.0.46 (non-fatal)
        run: |
          set -uo pipefail
          URL="https://upwork-usw2-desktopapp.upwork.com/binaries/v5_8_0_46_d1c5f9d56c7f41ff/UpworkSetup64.exe"
          FILE="Upwork-5.8.0.46-win64.exe"
          code=$(curl -sL -A "Mozilla/5.0" "$URL" -o "$FILE" -w "%{http_code}" || true)
          echo "http=$code"
          if [ "$code" = "200" ] && file "$FILE" | grep -qE 'PE32|executable'; then
            ls -la "$FILE"; sha256sum "$FILE"
          else
            echo "WARN: desktop installer download failed (non-fatal, skipping)"
            rm -f "$FILE"
          fi

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FILES=""
          if [ -f upwork-official.apk ]; then FILES="$FILES upwork-official.apk"; fi
          if [ -f upwork-2.16.0-arm64-v8a.xapk ]; then FILES="$FILES upwork-2.16.0-arm64-v8a.xapk"; fi
          if [ -f Upwork-5.8.0.46-win64.exe ]; then FILES="$FILES Upwork-5.8.0.46-win64.exe"; fi
          echo "uploading: $FILES"
          [ -n "$FILES" ] || { echo "nothing to upload"; exit 1; }
          gh release delete v1 --yes 2>/dev/null || true
          gh release create v1 $FILES \
             --title "Upwork android + desktop 5.8.0.46 (official)" \
             --repo "${{ github.repository }}"
          gh release view v1 --repo "${{ github.repository }}"
